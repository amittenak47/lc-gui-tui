# Build both sideloadable debug APKs on every push to main (and on manual run).
#
# This is a Tauri 2 Android app under `app/`, not a root Gradle project.
#
# Two flavors, one matrix:
#
#   Practice          everything, including the Practice card and the
#                     RustPython judge. aarch64 only, because rustpython 0.5
#                     does not compile for 32-bit Android.
#   Whiteboard-only   no Practice, no RustPython. Needs both the Vite flag and
#                     `--no-default-features`; the wrapper script sets both.
#
# Local equivalent:
#   cd app && npm run android:init
#   npm run android:apk:practice      # or android:apk:whiteboard
#
# Install on tablet: Actions -> this workflow -> latest run -> Artifacts ->
# download the flavor you want -> open the APK (allow unknown apps). Both
# flavors share package `dev.lc.whiteboard`. Use `adb install -r` to update or
# switch when the signing certificate and version code are compatible. A normal
# uninstall removes local data; choose a fresh install only after verifying an
# export or backup of the library and configuration you need.

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.flavor }} apk
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      # One flavor failing should not cancel the other. A Practice-only break
      # in RustPython or the judge says nothing about the Whiteboard-only build.
      fail-fast: false
      matrix:
        include:
          - flavor: practice
            script: android:apk:practice
            artifact: pen-island-practice-debug.apk
          - flavor: whiteboard-only
            script: android:apk:whiteboard
            artifact: pen-island-whiteboard-only-debug.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The action default still installs the legacy `tools` package. Google
      # removed it from the SDK repository, so sdkmanager exits with
      # "Failed to find package 'tools'". This build only needs platform-tools
      # (adb) here; the NDK is installed in the next step.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # CI pins r26d; the author device was tested with NDK 29.0.13846066.
      # If a build fails here and not locally, or the reverse, check this
      # toolchain difference first.
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Export Android env
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          # The two flavors differ by cargo features, so they must not share a
          # cache entry, or one keeps restoring the other's artifacts.
          key: ${{ matrix.flavor }}

      # Gradle BuildTask.kt invokes `cargo tauri …`; the npm CLI alone is not enough.
      - name: Install cargo tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.4

      - name: Install npm dependencies
        working-directory: app
        run: npm ci

      - name: Init Android project + cleartext overlay
        working-directory: app
        run: npm run android:init

      # With the ANDROID_DEBUG_KEYSTORE_B64 secret set, every CI build is
      # signed with that one debug key, so a CI APK installs over the previous
      # one (and over local builds made with the same keystore) with
      # `adb install -r`, keeping the app's data. Without the secret (forks,
      # or a repo that never set it) the runner makes a fresh key per build.
      - name: Use the shared debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$ANDROID_DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 is not set; this APK gets a one-off debug key."
          fi

      - name: Build debug APK
        working-directory: app
        run: npm run ${{ matrix.script }}

      # Tauri names the output for what it built: `universal` when it built
      # every architecture, `arm64` when it was pinned to aarch64. Practice is
      # pinned, Whiteboard-only is not, so both names are in play.
      - name: Stage APK
        run: |
          set -euo pipefail
          OUT="app/src-tauri/gen/android/app/build/outputs"
          APK=""
          for candidate in \
            "$OUT/apk/universal/debug/app-universal-debug.apk" \
            "$OUT/apk/arm64/debug/app-arm64-debug.apk"; do
            if [ -f "$candidate" ]; then APK="$candidate"; break; fi
          done
          if [ -z "$APK" ]; then
            echo "No APK at either expected path. Searching $OUT"
            find "$OUT" -name '*.apk' -print || true
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/${{ matrix.artifact }}"
          echo "Staged $APK -> dist/${{ matrix.artifact }}"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 30
