[package]
name = "whiteboard-gui"
version = "0.1.0"
edition = "2021"
description = "Handwriting whiteboard for the practice harness"
license = "PolyForm-Noncommercial-1.0.0"

# `staticlib`/`cdylib` are what the Android and iOS targets link against; `rlib`
# keeps `cargo test` working on the desktop.
[lib]
name = "whiteboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["leetcode"]
leetcode = ["harness/leetcode", "dep:malachite-bigint"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tauri-plugin-opener = "2.5.4"
base64 = "0.22"
harness = { path = "../..", package = "whiteboard", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
# rustpython-stdlib 0.5 wants malachite-bigint 0.9; upstream pymath pulls
# any 0.x (0.10). Pin + [patch] third_party/pymath so unlocked resolve
# unifies on 0.9.2 the same way the harness does.
malachite-bigint = { version = "=0.9.2", optional = true }

# ML Kit exists only on Android; the desktop build never compiles it and falls
# back to typed text or a PNG sent to a vision model.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-inkrecognition = { path = "plugins/inkrecognition" }
tauri-plugin-gallerysave = { path = "plugins/gallerysave" }
tauri-plugin-gestureguard = { path = "plugins/gestureguard" }
# wry has no child webview on Android; the live pane and the offscreen page
# render are both a child webview. This plugin is that surface, in Kotlin.
tauri-plugin-livewebview = { path = "plugins/livewebview" }
# Only the share bridge needs it, and only on Android — the desktop build has
# no share sheet to hand bytes to.
base64 = "0.22"

[profile.release]
lto = true
strip = true

# Same patch as the repo-root Cargo.toml: bundled libffi-sys on Android.
[patch.crates-io]
libffi = { path = "../../third_party/libffi" }
libffi-sys = { path = "../../third_party/libffi-sys" }
pymath = { path = "../../third_party/pymath" }
