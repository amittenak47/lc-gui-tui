[package]
name = "tauri-plugin-voicedictation"
version = "0.1.0"
edition = "2021"
description = "Speech-to-text into the agent composer through Android's SpeechRecognizer"
license = "PolyForm-Noncommercial-1.0.0"
links = "tauri-plugin-voicedictation"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
