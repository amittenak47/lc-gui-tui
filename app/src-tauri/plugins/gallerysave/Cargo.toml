[package]
name = "tauri-plugin-gallerysave"
version = "0.1.0"
edition = "2021"
description = "Save PNG captures into the device Photos / Pictures library"
license = "PolyForm-Noncommercial-1.0.0"
links = "tauri-plugin-gallerysave"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
base64 = "0.22"
