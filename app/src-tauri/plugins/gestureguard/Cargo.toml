[package]
name = "tauri-plugin-gestureguard"
version = "0.1.0"
edition = "2021"
description = "Keep Android's back-gesture strips off the drawing surface"
license = "PolyForm-Noncommercial-1.0.0"
links = "tauri-plugin-gestureguard"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
