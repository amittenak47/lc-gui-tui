[package]
name = "tauri-plugin-livewebview"
version = "0.1.0"
edition = "2021"
description = "A child WebView that can be placed, hidden and evaluated on Android, where wry has none"
license = "PolyForm-Noncommercial-1.0.0"
links = "tauri-plugin-livewebview"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
