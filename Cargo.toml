[package]
name = "whiteboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "LeetCode practice harness: index a local JSON corpus, materialize Python workspaces, run tests, ask an LLM tutor"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "lc"
path = "src/main.rs"

[features]
default = ["leetcode"]
# Practice corpus, RustPython judge, /workspace/:id/test. Pads-only Tauri
# builds omit this so the APK does not link the VM.
leetcode = ["dep:rustpython", "dep:malachite-bigint"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
minijinja = "2"
toml = "0.8"
directories = "5"
colored = "2"
comfy-table = "7"
rand = "0.8"
arboard = "3"
ratatui = "0.29"
crossterm = "0.28"
walkdir = "2"
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
# rustpython-stdlib 0.5 pins malachite-bigint ^0.9; pymath 0.2 pulls ^0 which
# otherwise resolves to 0.10 and the stdlib crate will not compile.
malachite-bigint = { version = "=0.9.2", optional = true }
rustpython = { version = "0.5.0", optional = true, default-features = false, features = ["stdlib", "freeze-stdlib", "importlib", "stdio", "host_env", "threading"] }

[profile.release]
lto = true
strip = true

[dev-dependencies]
tempfile = "3.27.0"
