[package]
name = "whiteboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "LeetCode practice harness: index a local JSON corpus, materialize Python workspaces, run tests, ask an LLM tutor"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "lc"
path = "src/main.rs"

[[bin]]
name = "audit_tests"
path = "src/bin/audit_tests.rs"

[features]
default = ["leetcode"]
# Practice corpus, RustPython judge, /workspace/:id/test. Whiteboard-only Tauri
# builds omit this so the APK does not link the VM.
leetcode = ["dep:rustpython", "dep:malachite-bigint"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
minijinja = "2"
toml = "0.8"
directories = "5"
colored = "2"
comfy-table = "7"
rand = "0.8"
walkdir = "2"
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
base64 = "0.22"
# rustpython-stdlib 0.5 pins malachite-bigint ^0.9. Upstream pymath 0.2 uses
# version "0" (any 0.x) and unlocked resolve picks 0.10. Two BigInt types,
# rustpython will not compile. [patch] third_party/pymath pins =0.9.2 so
# `cargo install --path .` works without --locked.
malachite-bigint = { version = "=0.9.2", optional = true }
rustpython = { version = "0.5.0", optional = true, default-features = false, features = ["stdlib", "freeze-stdlib", "importlib", "stdio", "host_env", "threading"] }

[profile.release]
lto = true
strip = true

# TUI + clipboard are CLI/desktop only. The Android APK links this crate as a
# lib (in-process harness) and those crates do not build for Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3.27.0"

# rustpython-vm enables libffi `system` on Android. Upstream forwards that to
# libffi-sys, which then links the NDK's missing -lffi. This patch no-ops
# `system` so libffi-sys builds C libffi from source.
[patch.crates-io]
libffi = { path = "third_party/libffi" }
libffi-sys = { path = "third_party/libffi-sys" }
pymath = { path = "third_party/pymath" }
