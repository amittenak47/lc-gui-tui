[package]
name = "pymath"
authors = ["Jeong, YunWon <jeong@youknowone.org>"]
repository = "https://github.com/RustPython/pymath"
description = "A binary representation compatible Rust implementation of Python's math library."
version = "0.2.0"
edition = "2024"
license = "PSF-2.0"
publish = false

[features]
default = ["complex"]
complex = ["dep:num-complex"]
num-bigint = ["_bigint", "dep:num-bigint"]
malachite-bigint = ["_bigint", "dep:malachite-bigint"]
_bigint = ["dep:num-traits", "dep:num-integer"]
mul_add = []

[target.'cfg(not(any(unix, windows)))'.dependencies]
libm = "0.2"

[dependencies]
libc = "0.2"
num-complex = { version = "0.4", optional = true }
num-bigint = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }
num-integer = { version = "0.1", optional = true }
# Upstream uses "0" (any 0.x). Pin 0.9.2 so rustpython-stdlib 0.5 and this
# crate share one BigInt. See VENDOR.md.
malachite-bigint = { version = "=0.9.2", optional = true }
